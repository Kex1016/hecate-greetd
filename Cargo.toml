[package]
name = "hecate-greetd"
version = "0.1.0"
edition = "2024"
description = "greetd greeter for hecate: the bundled shell's lock screen, with the look of whoever logs in"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kex1016/hecate-greetd"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
